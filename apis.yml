aid: tansu
name: Tansu
description: 'Tansu is an open-source (Apache-2.0), Rust-built, Apache Kafka compatible message broker that stores data in S3, PostgreSQL, SQLite/libSQL or memory and can write schema-validated topics (JSON Schema, Avro, Protocol Buffers) as Apache Iceberg or Delta Lake tables. Its surface is the Kafka wire protocol rather than an HTTP API, and no OpenAPI, AsyncAPI or GraphQL contract is published. The project has been renamed Nisshi (README: ''Nisshi (nee Tansu)''); github.com/tansu-io/tansu redirects to github.com/nisshi-io/nisshi and tansu.io no longer resolves in DNS.'
